<!DOCTYPE html>
<html lang="en">
<head>
  <title>Happy Birthday Mahamooda</title>
  <meta charset="UTF-8">
  <meta name="description" content="A birthday surprise for Mahamooda, made with love.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#392d35">
  <link rel="icon" href="../../images/others/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/surprise.css">
</head>
<body>
  <canvas class="fireflies" id="fireflies" aria-hidden="true"></canvas>
  <main class="surprise">
    <a class="back-link" href="../../index.html">Back to the celebration</a>

    <section class="birthday-card" aria-labelledby="birthday-title">
      <p class="eyebrow">A little keepsake, made with love</p>

      <div class="year" aria-label="2024">
        <span>20</span>
        <img
          class="portrait"
          src="../../images/humans/3_cr.jpg"
          alt="Mahamooda"
          width="397"
          height="397"
        >
        <span>24</span>
      </div>

      <h1 id="birthday-title">Happy Birthday <span>Mahamooda</span></h1>
      <p class="birthday-note">Wishing you a day full of love, laughter, and beautiful memories.</p>

      <div class="card-actions">
        <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false">
          <span class="music-icon" aria-hidden="true">♪</span>
          <span id="music-label">Play birthday song</span>
        </button>
        <a class="home-link" href="../../index.html">Back to the birthday card</a>
      </div>
      <p class="music-status" id="music-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <audio id="birthday-song" loop preload="none">
    <source src="../../audio/HBD-Human.mp3" type="audio/mpeg">
  </audio>
  <script src="../scripts/surprise.js"></script>
</body>
</html>
